<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Desbloquear cuenta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h1>🔓 Desbloquear cuenta</h1>
    <p>Ingresa la clave temporal para habilitar el acceso.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label>Clave temporal</label>
      <input type="password" name="clave_temporal" required placeholder="Clave temporal">

      <button class="btn-primary" type="submit">Desbloquear cuenta</button>
    </form>

    <br>
    <a href="{{ url_for('login') }}" class="btn-admin">Volver al login</a>
  </div>
</div>

</body>
</html>
