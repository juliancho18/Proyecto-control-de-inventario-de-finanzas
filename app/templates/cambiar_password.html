<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h1>🔐 Cambiar contraseña</h1>
    <p>Solo puedes cambiarla si conoces la contraseña anterior.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label>Contraseña anterior</label>
      <input type="password" name="password_anterior" required>

      <label>Nueva contraseña</label>
      <input type="password" name="password_nueva" required>

      <label>Confirmar nueva contraseña</label>
      <input type="password" name="confirmar_password" required>

      <button class="btn-primary" type="submit">Actualizar contraseña</button>
    </form>

    <br>
    <a href="{{ url_for('menu') }}" class="btn-admin">Volver al menú</a>
  </div>
</div>

</body>
</html>
